<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your World</title>
    <link rel="stylesheet" href="style.css">


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Schoolbell&display=swap" rel="stylesheet">
</head>
<body>
    <div id="world_container">

        <!--Buttons-->
        <button class="button" data-type="New world">Create New World</button>
        <button class="button" data-type="Upload">Upload World</button>

        <!--New World-->

        <div id="home">
            <div id="home_text">
                <div id="add_items">+</div>
            </div>
        </div>


        <div id="shapes_page">
            <h2 id="shape_text" >Choose your world's shape.</h2>
            <div id="shape_container"> 
                <div id="circle" class="shape resize" ></div>
                <div id="square" class="shape resize"></div>
            </div>
        </div>

        <div id="colours_page">
            <h2 id="colour_text">Choose your world's colour.</h2>
            
            
        </div>

        

        <div id="canvas_container">
            <h2>Add some texture to your world.</h2>
            <canvas id="canvas" width="100" height="100">test</canvas>
            <input type="range" id="canvas_brush_size" min="1" max="20" value="1">
            <div id="canvas_button_container">
                <button id="canvas_undo" class="orange">U</button>
                <button id="canvas_redo" class="orange">R</button>
            </div>
            <div id="tools">
                <button id="canvas_brush">Brush</button>
                <button id="canvas_eraser">Eraser</button>
            </div>
        </div>

        <div id="colour_container">
            <div id="colour_row">
                <div id="colour_1" class="colour"></div>
                <div id="colour_2" class="colour"></div>
                <div id="colour_3" class="colour"></div>
                <div id="colour_4" class="colour"></div>
                <div id="colour_5" class="colour"></div>
                <input type="color" class="colour" id="colour_picker">
                
            </div>
            <button id="confirm_button">Confirm</button>
        </div>

        


    </div>
    <script src="script.js"> </script>
</body>
</html>
